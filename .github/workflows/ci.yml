name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.14
          cache: true
      - name: Install locked workspaces
        run: mise run bootstrap
      - name: TypeScript, runtime and frontend
        run: pnpm check
      - name: Python experiments
        run: pnpm check:python
      - name: Real local Rivet restart
        run: pnpm verify:runtime
      - name: Real Pi Durable harness on Rivet
        run: pnpm verify:harness
      - name: Verify no generated changes
        run: git diff --exit-code

# Deployments are manual until cloud credentials and environment boundaries are configured.
# No schedule, public self-hosted runner, paid browser or external model calls in this workflow.

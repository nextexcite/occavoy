[project]
name = "occavoy-experiments"
version = "0.1.0"
requires-python = ">=3.15,<3.16"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["experiments/*"]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.6"]

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
